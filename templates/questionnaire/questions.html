<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Questions — Campus Connect AI</title><link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet"><style>
:root{--p:#6D45F5;--pd:#6938D9;--ink:#171717;--muted:#7A7A7A;--line:#E8E8ED;--soft:#F3EEFF;--page:#F7F5FF;--error:#EF4444}*{box-sizing:border-box}body{margin:0;background:var(--page);color:var(--ink);font-family:Inter,system-ui,sans-serif;-webkit-font-smoothing:antialiased}.app{width:100%;max-width:430px;min-height:100dvh;margin:0 auto;background:#fff;padding:18px 20px calc(32px + env(safe-area-inset-bottom));position:relative}.top{display:grid;grid-template-columns:44px 1fr auto;align-items:center;gap:12px;color:var(--muted);font-size:13px;font-weight:500}.back{display:grid;place-items:center;width:44px;height:44px;border:1px solid var(--line);border-radius:50%;color:var(--ink);text-decoration:none;font-size:25px;line-height:1}.top #counter{text-align:center}.top #pct{min-width:34px;text-align:right}.bar{height:7px;background:#E5E5EA;border-radius:999px;margin:22px 0 76px;overflow:hidden}.fill{height:100%;width:0;background:linear-gradient(90deg,var(--p),var(--pd));border-radius:inherit;transition:width .3s ease}.category{font-size:12px;font-weight:800;letter-spacing:.14em;color:var(--p)}.question{font-size:27px;font-weight:500;line-height:1.28;margin:14px 0 30px;letter-spacing:-.65px}.option{display:flex;align-items:center;min-height:58px;border:1px solid var(--line);border-radius:16px;padding:16px 18px;margin:12px 0;background:#fff;box-shadow:0 4px 14px rgba(30,20,70,.035);font-size:14px;line-height:1.35;cursor:pointer;transition:border-color .15s,background .15s,box-shadow .15s}.option:hover{border-color:#D9D0FF;box-shadow:0 6px 18px rgba(30,20,70,.06)}.option.selected{border-color:var(--p);background:var(--soft);color:var(--p);box-shadow:0 4px 14px rgba(109,69,245,.1)}.option input{display:none}.actions{display:flex;gap:12px;margin-top:48px}.btn{flex:1;height:48px;border:0;border-radius:13px;font:700 14px Inter,sans-serif;cursor:pointer}.next{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff;box-shadow:0 9px 20px rgba(109,69,245,.22)}.backbtn{background:#fff;border:1px solid var(--line);color:var(--ink);box-shadow:0 4px 12px rgba(30,20,70,.03)}.error{color:var(--error);font-size:12px;margin-top:10px}@media (min-width:461px){body{padding:18px 0}.app{border-radius:24px;box-shadow:0 10px 40px rgba(30,20,70,.07)}}</style></head><body><main class="app">{% csrf_token %}<div class="top"><a class="back" href="/questionnaire/hub/" aria-label="Go back">←</a><span id="counter"></span><span id="pct">0%</span></div><div class="bar"><div class="fill" id="fill"></div></div><div id="question"><p>Loading questions...</p></div><div class="actions"><button class="btn backbtn" id="prev" type="button">Back</button><button class="btn next" id="next" type="button">Next</button></div><div class="error" id="error"></div></main><script>
let questions=[],index=0,answers={},isSaving=false,autoAdvanceTimer;const qel=document.getElementById('question');const error=document.getElementById('error');
function render(){const q=questions[index];document.getElementById('counter').textContent=`Question ${index+1} of ${questions.length}`;document.getElementById('pct').textContent=`${Math.round((index/questions.length)*100)}%`;document.getElementById('fill').style.width=`${(index/questions.length)*100}%`;qel.innerHTML=`<div class="category">${(q.category_name||q.category).toUpperCase()}</div><div class="question">${q.text}</div>`+(q.question_type==='SCALE'?['1','2','3','4','5'].map(v=>`<label class="option ${answers[q.id]===v?'selected':''}"><input type="radio" name="answer" value="${v}">${v}</label>`).join(''):q.options.map(o=>`<label class="option ${q.question_type==='MULTIPLE_CHOICE'?Array.isArray(answers[q.id])&&answers[q.id].includes(String(o.id))?'selected':'':answers[q.id]===o.id?'selected':''}"><input type="${q.question_type==='MULTIPLE_CHOICE'?'checkbox':'radio'}" name="answer" value="${o.id}" ${q.question_type==='MULTIPLE_CHOICE'&&Array.isArray(answers[q.id])&&answers[q.id].includes(String(o.id))?'checked':''}>${o.option_text}</label>`).join(''));qel.querySelectorAll('input').forEach(input=>input.onchange=()=>{if(q.question_type==='MULTIPLE_CHOICE'){const selected=Array.isArray(answers[q.id])?answers[q.id]:[];answers[q.id]=input.checked?[...selected,input.value]:selected.filter(value=>value!==input.value);render()}else{answers[q.id]=input.value;render();clearTimeout(autoAdvanceTimer);autoAdvanceTimer=setTimeout(()=>save(true),300)}})}
function csrfToken(){const match=document.cookie.match(/csrftoken=([^;]+)/);return match?match[1]:''}
async function save(autoAdvance){const q=questions[index],answer=answers[q.id];if(!answer||(Array.isArray(answer)&&answer.length===0)){error.textContent='Please choose an answer to continue.';return false}if(isSaving)return false;isSaving=true;error.textContent='';const payload=q.question_type==='SCALE'?{question:q.id,value:answer}:{question:q.id,value:'',selected_option_ids:Array.isArray(answer)?answer:[answer]};const response=await fetch('/api/questionnaire/responses/',{method:'POST',headers:{'Content-Type':'application/json','X-CSRFToken':csrfToken()},body:JSON.stringify(payload)});if(!response.ok){isSaving=false;error.textContent='Your answer could not be saved.';return false}isSaving=false;if(autoAdvance){if(index<questions.length-1){index++;render()}else{const done=await fetch('/api/questionnaire/complete/',{method:'POST',headers:{'X-CSRFToken':csrfToken()}});location.href=done.ok?'/matches/ready/':'/questionnaire/hub/'}}return true}
document.getElementById('next').onclick=async()=>{if(await save(false)){if(index<questions.length-1){index++;render()}else{const done=await fetch('/api/questionnaire/complete/',{method:'POST',headers:{'X-CSRFToken':csrfToken()}});location.href=done.ok?'/matches/ready/':'/questionnaire/hub/'}}};document.getElementById('prev').onclick=()=>{clearTimeout(autoAdvanceTimer);if(index>0){index--;render()}else location.href='/questionnaire/hub/'};fetch('/api/questionnaire/questions/',{credentials:'same-origin'}).then(function(response){if(!response.ok)throw new Error('Questions request failed: '+response.status);return response.json()}).then(function(data){if(!Array.isArray(data)||data.length===0)throw new Error('No active questionnaire questions found');questions=data;render()}).catch(function(){qel.innerHTML='';error.textContent='Unable to load questions. Please try again.'});
</script>{% include 'includes/bottom_nav.html' with active_nav='matches' %}</body></html>
