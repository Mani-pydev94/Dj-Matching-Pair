<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Your Compatibility Profile</title><style>
body{margin:0;background:#faf9ff;color:#171717;font-family:Inter,system-ui,sans-serif}.app{max-width:430px;min-height:100dvh;margin:auto;background:#fff;padding:22px 20px;box-sizing:border-box}.top{display:flex;justify-content:space-between;align-items:center}.back{font-size:24px;color:#171717;text-decoration:none}h1{font-size:24px;margin:28px 0 6px}.sub{font-size:13px;color:#737373}.progress{margin:20px 0;height:8px;background:#eeeaf8;border-radius:99px;overflow:hidden}.fill{height:100%;width:0;background:#7547f5}.card{display:block;text-decoration:none;color:#171717;border:1px solid #ececf2;border-radius:17px;padding:16px;margin:10px 0;box-shadow:0 5px 18px #1e14460b}.card strong{display:block;font-size:14px}.card small{color:#737373;display:block;margin-top:6px;font-size:11px}.btn{display:block;text-align:center;margin-top:20px;height:48px;line-height:48px;border-radius:13px;background:linear-gradient(135deg,#7547f5,#6a3fe8);color:#fff;text-decoration:none;font-weight:700;font-size:14px}</style></head><body><main class="app"><div class="top"><a class="back" href="{% url 'questionnaire_intro' %}">←</a><span>Compatibility Profile</span><span>0%</span></div><h1>Your Compatibility Profile</h1><p class="sub">Your answers help us find the right students for you.</p><div class="progress"><div class="fill"></div></div><div id="categories"><p class="sub">Loading your categories...</p></div>

<a class="btn" href="/questionnaire/questions/">Continue</a></main><script>
fetch('/api/questionnaire/categories/').then(r=>r.ok?r.json():Promise.reject()).then(data=>{document.getElementById('categories').innerHTML=data.map(c=>`<a class="card" href="/questionnaire/questions/"><strong>${c.name}</strong><small>${c.question_count} Questions · ${c.answered_count||0}/${c.question_count} answered</small></a>`).join('')}).catch(()=>{document.getElementById('categories').innerHTML='<p class="sub">Unable to load categories. Please try again.</p>'});
</script>
