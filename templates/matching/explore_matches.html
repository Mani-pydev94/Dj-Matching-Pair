<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Explore Matches — Campus Connect AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root{--p:#7C4DFF;--pd:#6F42E8;--soft:#F1EBFF;--bg:#FAF9FF;--text:#171717;--muted:#737373;--line:#E8E6EE;--green:#10B981}
    *{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}
    .app{width:100%;max-width:430px;min-height:100dvh;margin:auto;background:#fff;padding:18px 18px 112px}
    .header{display:grid;grid-template-columns:40px 1fr 40px;align-items:center;gap:10px}.header h1{text-align:center;font-size:19px;margin:0;font-weight:800}.round{display:grid;place-items:center;width:40px;height:40px;border:1px solid var(--line);border-radius:50%;background:#fff;color:#4b4755}.round svg{width:19px;height:19px}
    .search{display:flex;align-items:center;gap:9px;height:44px;margin-top:18px;padding:0 12px;background:#F3F3F5;border-radius:13px;color:#92909a}.search input{min-width:0;flex:1;border:0;outline:0;background:transparent;font:13px Inter;color:var(--text)}.search input::placeholder{color:#96949d}.mic{border:0;background:transparent;color:#97949f;padding:0}
    .chips{display:flex;gap:8px;overflow:auto;margin:16px 0 25px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{flex-shrink:0;border:1px solid var(--line);border-radius:999px;padding:9px 15px;background:#fff;color:#62606a;font:600 11px Inter;cursor:pointer}.chip.active{background:var(--p);border-color:var(--p);color:#fff}
    .result-head{display:flex;align-items:end;justify-content:space-between;margin-bottom:13px}.result-head h2{margin:0;font-size:17px;letter-spacing:-.2px}.result-head p{margin:5px 0 0;color:#92909a;font-size:11px}.result-count{color:#92909a;font-size:12px}
    .results{display:grid;gap:13px}.card{padding:16px;border:1px solid var(--line);border-radius:17px;background:#fff;box-shadow:0 4px 18px #1414280d}.card.private-card{border-color:#e5dcff;background:linear-gradient(145deg,#fff,#fcfaff)}.person{display:flex;align-items:center;gap:12px}.avatar{width:58px;height:58px;flex-shrink:0;border-radius:17px;object-fit:cover;background:var(--soft);border:1px solid #e7defe}.avatar.blurred{filter:blur(10px)}.avatar-placeholder{display:grid;place-items:center;width:58px;height:58px;border-radius:17px;background:var(--soft);color:var(--p);font-size:20px;font-weight:800}.private-avatar{position:relative}.private-avatar:after{content:'🔒';position:absolute;right:-5px;bottom:-5px;display:grid;place-items:center;width:21px;height:21px;border:2px solid #fff;border-radius:50%;background:var(--p);font-size:10px}.name{font-size:15px;font-weight:800}.meta{margin-top:4px;color:var(--muted);font-size:11px;line-height:1.4}.private-meta{color:var(--p);font-weight:700}.score{margin-left:auto;align-self:flex-start;padding:7px 9px;border-radius:10px;background:var(--soft);color:var(--p);font-size:15px;font-weight:800;white-space:nowrap}.score small{display:block;text-align:center;font-size:8px;letter-spacing:.04em}
    .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px}.tag{padding:6px 9px;border-radius:999px;background:#F8F5FF;color:#7651dc;font-size:10px;font-weight:600}.reason{margin:13px 0 0;color:#55505f;font-size:12px;line-height:1.5}.reason strong{color:#292431}.actions{display:flex;gap:8px;margin-top:15px}.btn{display:grid;place-items:center;min-height:40px;flex:1;border:0;border-radius:11px;padding:0 10px;font:700 11px Inter;text-decoration:none;cursor:pointer}.primary{background:linear-gradient(135deg,var(--p),var(--pd));color:#fff}.secondary{background:#F8F5FF;color:var(--p)}.btn:disabled{cursor:default;opacity:.65}.state{margin:15px 0 0;color:var(--green);font-size:11px;font-weight:700;text-align:center}
    .empty,.error{padding:31px 20px;text-align:center;border:1px dashed #d9d1ee;border-radius:17px;background:#fcfaff}.empty-icon{display:grid;place-items:center;width:50px;height:50px;margin:auto;border-radius:16px;background:var(--soft);color:var(--p)}.empty h3,.error h3{margin:13px 0 6px;font-size:15px}.empty p,.error p{margin:0;color:var(--muted);font-size:12px;line-height:1.5}.skeleton{height:190px;background:linear-gradient(90deg,#f4f2f8 25%,#fff 50%,#f4f2f8 75%);background-size:200% 100%;animation:shine 1.2s infinite}@keyframes shine{to{background-position:-200% 0}}
    .toast{position:fixed;top:18px;right:18px;left:18px;z-index:50;max-width:394px;margin:auto;padding:13px 15px;border-radius:12px;background:#ECFDF3;color:#087443;font-size:12px;font-weight:700;box-shadow:0 8px 24px #14502d29}
    .sheet-backdrop{position:fixed;inset:0;z-index:30;background:#17122b55;opacity:0;pointer-events:none;transition:opacity .2s}.sheet{position:absolute;right:0;bottom:0;left:0;max-width:430px;margin:auto;padding:22px 20px 28px;border-radius:22px 22px 0 0;background:#fff;transform:translateY(100%);transition:transform .25s}.sheet-backdrop.open{opacity:1;pointer-events:auto}.sheet-backdrop.open .sheet{transform:translateY(0)}.sheet h2{margin:0 0 16px;font-size:18px}.sheet-row{margin:15px 0}.sheet-row label{display:block;margin-bottom:7px;font-size:12px;font-weight:700}.sheet-row input,.sheet-row select{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;font:13px Inter}.sheet-actions{display:flex;gap:9px;margin-top:20px}.sheet-actions button{flex:1}
    @media(min-width:431px){.app{box-shadow:0 0 35px #33245c0d}}
  </style>
</head>
<body>
<main class="app">
  <header class="header"><a class="round" href="{% url 'home' %}" aria-label="Back"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m15 18-6-6 6-6"/></svg></a><h1>Explore Matches</h1><button class="round" id="filter-open" type="button" aria-label="Open filters"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 6h16M7 12h10m-7 6h4"/></svg></button></header>
  <form class="search" id="search-form"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input id="search" placeholder="Search by name, skill, interest or college" aria-label="Search matches"><button class="mic" type="button" aria-label="Voice search"><svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10a7 7 0 0 0 14 0M12 19v3m-4 0h8"/></svg></button></form>
  <div class="chips"><button class="chip active" data-filter="all">All</button><button class="chip" data-filter="career">Career goals</button><button class="chip" data-filter="learning">Learning style</button><button class="chip" data-filter="interest">Shared interests</button><button class="chip" data-filter="university">Same college</button></div>
  <section class="result-head"><div><h2 id="result-title">Compatible students</h2><p>Sorted by AI compatibility</p></div><span class="result-count" id="result-count">—</span></section>
  <div id="results" class="results"><div class="card skeleton"></div><div class="card skeleton"></div></div>
</main>
<div class="sheet-backdrop" id="filter-sheet"><section class="sheet" role="dialog" aria-modal="true" aria-labelledby="filter-title"><h2 id="filter-title">Filter matches</h2><div class="sheet-row"><label for="threshold">Minimum compatibility</label><select id="threshold"><option value="75">75% or higher</option><option value="60">60% or higher</option><option value="40">40% or higher</option></select></div><div class="sheet-row"><label for="university">College or university</label><input id="university" placeholder="Any college"></div><div class="sheet-actions"><button class="btn secondary" id="filter-reset" type="button">Reset</button><button class="btn primary" id="filter-apply" type="button">Apply filters</button></div></section></div>
{% csrf_token %}
{% include 'includes/bottom_nav.html' with active_nav='matches' %}
<script>
const results = document.getElementById('results');
const search = document.getElementById('search');
const count = document.getElementById('result-count');
const title = document.getElementById('result-title');
const csrfToken = document.querySelector('[name=csrfmiddlewaretoken]').value;
const sheet = document.getElementById('filter-sheet');
let allMatches = [];
let activeFilter = 'all';

function escapeHtml(value) {
  return String(value || '').replace(/[&<>"']/g, character => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[character]));
}
function initials(name) { return escapeHtml((name || 'S').trim().charAt(0).toUpperCase()); }
function csrf() { return csrfToken; }
function searchable(match) {
  return [match.display_name, match.field_of_study, match.university, ...(match.shared_interests || []), ...(match.reasons || [])].join(' ').toLowerCase();
}
function visibleMatches() {
  const query = search.value.trim().toLowerCase();
  return allMatches.filter(match => {
    const textMatch = !query || searchable(match).includes(query);
    const reasons = (match.reasons || []).join(' ').toLowerCase();
    const filterMatch = activeFilter === 'all' ||
      (activeFilter === 'career' && reasons.includes('career')) ||
      (activeFilter === 'learning' && reasons.includes('learning')) ||
      (activeFilter === 'interest' && ((match.shared_interests || []).length || reasons.includes('interest'))) ||
      (activeFilter === 'university' && match.profile_factors && match.profile_factors.university === 100);
    return textMatch && filterMatch;
  });
}
function renderMatches() {
  const matches = visibleMatches();
  count.textContent = `${matches.length} found`;
  title.textContent = `${matches.length} Compatible Student${matches.length === 1 ? '' : 's'} Found`;
  if (!matches.length) {
    results.innerHTML = `<div class="empty"><div class="empty-icon"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="9" cy="8" r="3"/><path d="M3 20a6 6 0 0 1 12 0M19 8v6m-3-3h6"/></svg></div><h3>No matches found</h3><p>Complete your questionnaire to discover compatible students.</p><div class="actions"><a class="btn primary" href="{% url 'questionnaire_questions' %}">Complete questionnaire</a><a class="btn secondary" href="/communities/">Explore communities</a></div></div>`;
    return;
  }
  results.innerHTML = matches.map(match => {
    const isConnected = ['ACCEPTED', 'CONNECTED'].includes(match.connection_status) && !match.is_private;
    const photo = isConnected && match.profile_photo ? `<img class="avatar" src="${escapeHtml(match.profile_photo)}" alt="">` : `<div class="avatar-placeholder private-avatar">🔒</div>`;
    const tags = isConnected ? (match.shared_interests || []).slice(0, 4).map(item => `<span class="tag">${escapeHtml(item)}</span>`).join('') : '<span class="tag">Private profile</span><span class="tag">Details hidden</span>';
    const score = `<span class="score">${escapeHtml(match.overall_score)}%<small>MATCH</small></span>`;
    let action = '';
    if (match.connection_status === 'NONE' || match.connection_status === 'DECLINED') action = `<button class="btn primary connect" data-user="${escapeHtml(match.user_id)}">Connect</button>`;
    else if (['ACCEPTED', 'CONNECTED'].includes(match.connection_status)) action = `<button class="btn secondary cancel-connection" data-connection="${escapeHtml(match.connection_id)}">Cancel connection</button>`;
    else if (match.connection_status === 'PENDING') {
      action = `<button class="btn secondary cancel-request" data-connection="${escapeHtml(match.connection_id)}">Cancel request</button>`;
    }
    const meta = isConnected ? `${escapeHtml(match.field_of_study || 'Student')}${match.university ? ' · ' + escapeHtml(match.university) : ''}` : '🔒 Private until connection';
    const reason = isConnected ? escapeHtml((match.reasons || []).join(' · ') || 'Compatible questionnaire answers') : 'Connect to unlock profile details';
    return `<article class="card${isConnected ? '' : ' private-card'}"><div class="person">${photo}<div><div class="name">${escapeHtml(match.display_name)}</div><div class="meta${isConnected ? '' : ' private-meta'}">${meta}</div></div>${score}</div><div class="tags">${tags}</div><p class="reason"><strong>${isConnected ? 'Why you match' : 'Private profile'}</strong><br>${reason}</p><div class="actions">${action}<a class="btn secondary" href="/profiles/${escapeHtml(match.user_id)}/">${isConnected ? 'View profile' : '🔒 View locked profile'}</a></div></article>`;
  }).join('');
  document.querySelectorAll('.connect').forEach(button => button.addEventListener('click', sendRequest));
  document.querySelectorAll('.cancel-request').forEach(button => button.addEventListener('click', cancelRequest));
  document.querySelectorAll('.cancel-connection').forEach(button => button.addEventListener('click', cancelRequest));
}
async function sendRequest(event) {
  const button = event.currentTarget; button.disabled = true; button.textContent = 'Sending...';
  try {
    const response = await fetch('/api/connections/request/', {method:'POST', headers:{'Content-Type':'application/json','X-CSRFToken':csrf()}, body:JSON.stringify({user_id:button.dataset.user})});
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Unable to send request');
    const match = allMatches.find(item => String(item.user_id) === button.dataset.user);
    if (match) {
      match.connection_status = data.status || 'PENDING';
      match.connection_id = data.id;
    }
    renderMatches();
    showToast('Connection request sent. The student will be notified.');
  } catch (error) {
    button.disabled = false;
    button.textContent = 'Connect';
    showToast(error.message || 'Unable to send connection request.', true);
  }
}
function showToast(message, isError = false) {
  const toast = document.createElement('div');
  toast.className = 'toast';
  toast.style.background = isError ? '#FEF2F2' : '#ECFDF3';
  toast.style.color = isError ? '#B42318' : '#087443';
  toast.textContent = message;
  document.body.appendChild(toast);
  window.setTimeout(() => toast.remove(), 3500);
}
async function cancelRequest(event) {
  const button = event.currentTarget;
  const wasConnection = button.classList.contains('cancel-connection');
  button.disabled = true;
  button.textContent = 'Cancelling...';
  try {
    const response = await fetch(`/api/connections/${button.dataset.connection}/cancel/`, {
      method: 'POST',
      headers: {'X-CSRFToken': csrf()},
    });
    const data = await response.json();
    if (!response.ok) throw new Error(data.detail || 'Unable to cancel connection');
    const match = allMatches.find(item => String(item.connection_id) === button.dataset.connection);
    if (match) {
      match.connection_status = 'DECLINED';
      match.connection_id = null;
    }
    renderMatches();
  } catch (error) {
    button.disabled = false;
    button.textContent = wasConnection ? 'Cancel connection' : 'Cancel request';
    alert(error.message || 'Unable to cancel connection. Please try again.');
  }
}
async function loadMatches() {
  try {
    const threshold = document.getElementById('threshold').value;
    const university = document.getElementById('university').value.trim();
    const params = new URLSearchParams({min_score: threshold}); if (university) params.set('university', university);
    const response = await fetch(`/api/matches/?${params}`);
    if (!response.ok) throw new Error();
    const data = await response.json(); allMatches = data.results || []; renderMatches();
  } catch (error) {
    results.innerHTML = `<div class="error"><h3>Unable to load matches</h3><p>Something went wrong while loading your recommendations.</p><button class="btn primary" onclick="loadMatches()">Try again</button></div>`; count.textContent = '—';
  }
}
search.addEventListener('input', renderMatches);
document.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => {document.querySelectorAll('.chip').forEach(item => item.classList.remove('active')); chip.classList.add('active'); activeFilter = chip.dataset.filter; renderMatches();}));
document.getElementById('filter-open').addEventListener('click', () => sheet.classList.add('open'));
document.getElementById('filter-reset').addEventListener('click', () => {document.getElementById('threshold').value='75'; document.getElementById('university').value='';});
document.getElementById('filter-apply').addEventListener('click', () => {sheet.classList.remove('open'); loadMatches();});
sheet.addEventListener('click', event => {if (event.target === sheet) sheet.classList.remove('open');});
loadMatches();
</script>
</body>
</html>
