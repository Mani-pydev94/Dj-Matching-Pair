<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matches Ready</title><style>body{margin:0;background:#faf9ff;font-family:Inter,system-ui,sans-serif;color:#171717}.app{max-width:430px;min-height:100dvh;margin:auto;background:#fff;padding:24px 20px;text-align:center;box-sizing:border-box}.back{text-align:left;display:block;color:#171717;text-decoration:none;font-size:24px}.visual{width:80px;height:80px;margin:72px auto 25px;border-radius:28px;background:linear-gradient(135deg,#7547f5,#6a3fe8);color:#fff;display:grid;place-items:center;font-size:34px}h1{font-size:27px;margin:0 0 10px}p{font-size:14px;color:#737373;line-height:1.6}.btn{display:block;height:50px;line-height:50px;border-radius:14px;text-decoration:none;font-weight:700;font-size:14px;margin-top:26px}.primary{background:linear-gradient(135deg,#7547f5,#6a3fe8);color:#fff}.secondary{color:#7547f5}</style></head><body><main class="app"><a class="back" href="{% url 'home' %}">←</a><div class="visual">✦</div><h1>Your compatibility profile is ready!</h1><p>We've analyzed your answers to find students who may share your interests, goals and working style.</p><div id="count"></div><a class="btn primary" href="{% url 'explore_matches' %}">Explore My Matches</a><a class="btn secondary" href="{% url 'questionnaire_questions' %}">Review My Answers</a></main><script>fetch('/api/matches/?min_score=0').then(r=>r.json()).then(d=>{document.getElementById('count').textContent=`${d.results.length} potential matches found`}).catch(()=>{})</script>{% include 'includes/bottom_nav.html' with active_nav='matches' %}</body></html>
